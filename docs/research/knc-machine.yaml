# S13-05. Repository evidence only; no new hardware measurements.
# Flat parameter records. Null means unknown, never zero. GB/s is decimal.
# V/R/E retain S12-14's meanings: verified source evidence (not reproduced here),
# reported project measurement, estimate/inference. V rows identify the existing
# source audit/index that verified them; this file does not requalify originals.
# Models use 7120 for the documented 7120P. Profiles are runner restrictions on
# that physical card, not physical 3120/5110P timing emulation. Empty applicability
# lists mean historical comparison only. Architectural rows apply across models;
# measured rows apply only to their stated machine, density and configuration.
# Core-cycle resource limits give conditional model bounds; measured rates are
# empirical roofs/prediction inputs, not proven hardware maxima.

